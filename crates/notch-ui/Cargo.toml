[package]
name = "notch-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
cxx = "1.0.95"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
notch-core = { path = "../notch-core" }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
